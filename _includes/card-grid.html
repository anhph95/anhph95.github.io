{% assign section = include.section %}

<section class="section{% if section.class %} {{ section.class }}{% endif %}">
  <div class="section-inner">
    {% if section.title %}<h2>{{ section.title }}</h2>{% endif %}
    <div class="cards">
      {% for item in section.items %}
      <a class="card card-link" href="{{ item.url | relative_url }}">
        <h3>{{ item.title }}</h3>
        <p>{{ item.summary }}</p>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
