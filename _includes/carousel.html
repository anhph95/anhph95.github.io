{% assign slides = include.items %}
{% assign label = include.label | default: "image" %}

<div class="carousel" data-carousel>
  <button class="carousel-button prev" type="button" data-prev aria-label="Previous {{ label }}">‹</button>

  {% for item in slides %}
  <figure data-slide{% unless forloop.first %} hidden{% endunless %}>
    {% include figure-media.html item=item %}
    {% if item.caption %}
    <figcaption>{{ item.caption | markdownify }}</figcaption>
    {% endif %}
  </figure>
  {% endfor %}

  <button class="carousel-button next" type="button" data-next aria-label="Next {{ label }}">›</button>
</div>
