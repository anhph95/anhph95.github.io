{% assign hero = site.data.home.hero %}

<section class="hero">
  {% if hero.carousel.items %}
  <div class="hero-bg-slider" data-hero-slider>
    {% for item in hero.carousel.items %}
    <div class="hero-bg-slide{% if forloop.first %} is-active{% endif %}" role="img" aria-label="{{ item.alt }}" style="background-image: url('{{ item.src | relative_url }}');"></div>
    {% endfor %}
    <button class="hero-bg-button prev" type="button" data-hero-prev aria-label="Previous {{ hero.carousel.label | default: 'homepage landscape' }}">‹</button>
    <button class="hero-bg-button next" type="button" data-hero-next aria-label="Next {{ hero.carousel.label | default: 'homepage landscape' }}">›</button>
  </div>
  {% endif %}

  <div class="hero-content">
    <div class="hero-copy">
      <p class="eyebrow">{{ hero.eyebrow }}</p>
      <h1>{{ hero.title }}</h1>
      <p class="lead">{{ hero.lead }}</p>
      <div class="hero-links">
        {% for link in hero.links %}
        <a class="button{% if link.variant %} {{ link.variant }}{% endif %}" href="{{ link.url | relative_url }}">{{ link.label }}</a>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
