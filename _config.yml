title: "Anh H. Pham"
description: "Biological oceanographer building AI-enabled observing systems for plankton ecosystems."

# Basic site settings
url: "https://anhph95.github.io"
baseurl: ""

# Author info
author:
  name: "Anh H. Pham"
  bio: "Biological oceanographer, plankton ecologist, and environmental data scientist."
  email: "anh.pham@whoi.edu"
  orcid: "https://orcid.org/0000-0001-7827-6558"
  github_username: "anhph95"
  linkedin_username: "huyanhpham"

# Social links (will show up in metadata and some themes)
social:
  orcid: "https://orcid.org/0000-0001-7827-6558"
  github: "https://github.com/anhph95"
  linkedin: "https://www.linkedin.com/in/huyanhpham/"
  google_scholar: "https://scholar.google.com/citations?user=XSOR-4EAAAAJ&hl=en"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Plugins for better features
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      author: "Anh H. Pham"

# Exclusions
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
