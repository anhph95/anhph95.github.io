<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% seo %}
    {% if page.url == '/' %}
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ResearchOrganization",
        "@id": "{{ site.url }}{{ site.baseurl }}/#organization",
        "name": "Computational Oceanography Lab",
        "url": "{{ site.url }}{{ site.baseurl }}/",
        "description": "A research lab studying plankton ecosystems, ocean observing systems, remote sensing, and artificial intelligence for marine science.",
        "parentOrganization": {
          "@type": "Organization",
          "name": "Woods Hole Oceanographic Institution",
          "url": "https://www.whoi.edu"
        },
        "sameAs": ["https://www.whoi.edu/"],
        "knowsAbout": [
          "Computational oceanography",
          "Biological oceanography",
          "Community dynamics",
          "Ocean AI",
          "Biogeochemical-Argo",
          "Remote sensing",
          "Machine learning",
          "Harmful algal blooms"
        ]
      }
    </script>
    {% elsif page.layout == 'person' %}
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "@id": "{{ site.url }}{{ site.baseurl }}{{ page.url | relative_url }}#profile",
        "url": "{{ site.url }}{{ site.baseurl }}{{ page.url | relative_url }}",
        "mainEntity": {
          "@type": "Person",
          "@id": "{{ site.url }}{{ site.baseurl }}{{ page.url | relative_url }}#person",
          "name": "Anh H. Pham",
          "givenName": "Anh",
          "familyName": "Pham",
          "alternateName": ["Anh Huy Pham", "Anh Pham"],
          "jobTitle": "Postdoctoral Investigator",
          "image": "{{ site.url }}{{ site.baseurl }}{{ page.portrait | relative_url }}",
          "worksFor": {
            "@type": "Organization",
            "name": "Woods Hole Oceanographic Institution",
            "url": "https://www.whoi.edu/"
          },
          "sameAs": [
            "{{ site.social.google_scholar }}",
            "{{ site.social.orcid }}",
            "{{ site.social.github }}",
            "{{ site.social.linkedin }}"
          ],
          "knowsAbout": [
            "Computational oceanography",
            "Biological oceanography",
            "Plankton ecology",
            "Computer vision",
            "Artificial intelligence",
            "Remote sensing",
            "Machine learning",
            "Harmful algal blooms"
          ]
        }
      }
    </script>
    {% endif %}
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">Computational Oceanography Lab</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <a href="{{ '/people/anhph/' | relative_url }}">People</a>
        <a href="{{ '/publications/' | relative_url }}">Publication</a>
        <a href="{{ '/teaching/' | relative_url }}">Teaching</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p>&copy; 2026 Woods Hole Oceanographic Institution</p>
      </div>
    </footer>
  </body>
</html>
