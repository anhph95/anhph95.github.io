intro:
  carousel:
    label: research image
    items:
      - src: /assets/media/stingray-deployment.jpg
        alt: Stingray imaging platform deployment at sea.
        caption: >-
          A Stingray tow-sled recovery. Platforms like this can carry imaging and environmental sensors through the water column; the research challenge is connecting those observations to ecological patterns.

      - src: /assets/media/ctd-sampling-during-rough-sea.jpg
        alt: CTD sampling in rough sea conditions.
        caption: >-
          CTD casts provide direct water-column measurements such as temperature, salinity, nutrients, and chlorophyll. These shipboard observations help ground-truth and interpret data from autonomous platforms and imaging systems.

  paragraphs:
    - Plankton are the drifting organisms that form the living foundation of marine ecosystems. Phytoplankton use sunlight and nutrients to photosynthesize, produce oxygen, support marine food webs, and influence carbon cycling, while zooplankton feed on phytoplankton and other small organisms and transfer energy to fish, seabirds, and larger marine life. Although many plankton are microscopic, their distributions and interactions shape ecosystem responses across very large ocean regions. Our research examines how plankton communities are organized, transported, and transformed in a changing ocean. Because these communities can change quickly as water masses move, mix, warm, freshen, or become nutrient enriched, understanding them requires more than a single sample or a static map. We combine field observations, autonomous platforms, satellite and modeled data, imaging systems, and computational analysis to connect biological patterns with the environmental conditions that shape them.

sections:
  - id: harmful-algal-blooms
    title: Harmful Algal Blooms
    blocks:
      - kind: paragraph
        text: >-
          Although phytoplankton are primary producers that support marine food webs, some species can become harmful when
          their growth disrupts ecosystems or produces toxins. Harmful algal blooms can contaminate seafood, close harvest
          areas, stress aquaculture and fisheries, and create risks for coastal communities.
          In collaboration with the Department of Marine Plankton at the
          <a href="https://vnio.org.vn/en/" target="_blank" rel="noopener noreferrer">Institute of Oceanography, Vietnam</a>,
          we study potentially harmful and toxin-producing algae in coastal waters. This work connects seasonal field
          observations, microscopy, morphology, phylogeny, and culture experiments to improve species
          identification and understand when harmful taxa occur. Closely related algae can have different ecological roles,
          toxin potential, and environmental tolerances, so species-level identification is central to interpreting bloom risk.
          In tropical coastal waters, warm temperatures, variable salinity, coral reefs, seagrass beds, seaweeds, and other
          benthic habitats can support harmful dinoflagellates, including taxa associated with diarrhetic, ciguatera, or
          paralytic shellfish poisoning. Understanding their growth conditions, seasonal occurrence, toxin potential, and
          species boundaries provides the biological foundation for coastal monitoring and seafood-safety decisions.

      - src: /assets/media/toxic-algae.png
        alt: Microscopic imagery of potentially harmful algal species.
        caption: >-
          Morphological examination followed by DNA sequencing is essential for reliable species identification, especially for potentially harmful algal taxa that can look very similar under the microscope. Culture experiments can provide additional confirmation. Accurate species identification helps assess bloom risk, toxin potential, ecological impacts, and risks to marine food products in coastal Vietnamese waters. Credit: Department of Marine Plankton, Institute of Oceanography, Vietnam. (<a href="https://doi.org/10.3390/toxins17020081" target="_blank" rel="noopener noreferrer">Nguyen-Ngoc et al. 2025</a>)
        class: wide-figure


  - id: biogeography
    title: Plankton Biogeography
    blocks:
      - kind: paragraph
        text: >-
          The ocean is physically connected, but it is not biologically uniform. Temperature, salinity, nutrients, light,
          currents, and mixing create environmental gradients that shape where different plankton groups grow, persist, or
          are transported. Marine biogeography asks where organisms live and why those patterns occur. It is often
          described using regional
          frameworks that divide the ocean into provinces, ecoregions, or assessment regions. These maps provide useful context,
          but plankton habitats are also shaped by moving gradients in salinity, nutrients, light, temperature, and water-column
          structure. Because the water itself moves, plankton habitats can shift, merge, and separate over time, carrying
          biological communities across the boundaries that appear fixed on a map. At the
          <a href="https://montoyalab.gatech.edu/" target="_blank" rel="noopener noreferrer">Montoya Lab @ Georgia Tech</a>, 
          we study these habitats as dynamic biological-environmental states rather than fixed geographic units.
          The same location can support different plankton communities under different seasonal, meteorological, or
          circulation conditions, and those changes influence productivity, food-web structure, and
          biogeochemical cycling.

      - kind: carousel
        label: biogeography framework
        items:
          - src: /assets/media/global-biogeography-longhurst-province.png
            alt: Global ocean biogeography map with Longhurst provinces.
            caption: >-
              Biogeochemical provinces based on recurring patterns in phytoplankton biomass, seasonality, and ocean conditions provide a useful baseline for comparing large regions, but many plankton habitats shift at finer scales as fronts, eddies, river plumes, and water masses move through them. (<a href="https://doi.org/10.1016/B978-0-12-455521-1.X5000-1" target="_blank" rel="noopener noreferrer">Longhurst 1998</a>)

          - src: /assets/media/global-biogeography-Spalding-marine-ecoregions.png
            alt: Global map of marine ecoregions.
            caption: >-
              Marine ecoregions organize coastal and shelf ecosystems into comparable ecological units. They help frame biodiversity patterns, but plankton communities may respond more directly to moving water masses and local gradients than to fixed map boundaries. (<a href="https://doi.org/10.1641/B570707" target="_blank" rel="noopener noreferrer">Spalding et al. 2007</a>)

          - src: /assets/media/global-biogeography-ipcc-ar6-marine-regions.png
            alt: Global map of IPCC AR6 marine regions.
            caption: >-
              IPCC AR6 marine regions provide standardized areas for assessing climate-driven ocean change. We use these broad frameworks as context while asking how plankton habitats vary within and across them. (<a href="https://doi.org/10.5194/essd-12-2959-2020" target="_blank" rel="noopener noreferrer">Iturbide et al. 2020</a>)

      - kind: paragraph
        text: Dynamic features such as river plumes, boundary currents, eddies, fronts, and water-mass intrusions create shifting habitats for plankton. These features can change the nutrients, light, and physical structure that plankton experience, which means nearby waters may support different communities. In the western tropical North Atlantic, the Amazon River Plume forms a patchwork of river-influenced and oceanic waters that favor different phytoplankton groups, including nitrogen-fixing organisms and other taxa adapted to strong salinity and nutrient gradients. Across the basin, circulation and seasonal changes alter nutrient supply, subsurface chlorophyll structure, and the movement of biological communities, so plankton biogeography becomes a question of both place and timing.

      - kind: gallery
        class: theme-gallery paired-gallery
        items:
          - src: /assets/media/dynamic-amazon-river-plume.gif
            alt: Animated shipboard observation of Amazon River plume dynamics.
            caption: >-
              Shipboard observations in the western tropical North Atlantic show the Amazon River Plume forming a moving mosaic of low-salinity plume water and oceanic water. This gradient creates distinct habitats that favor different phytoplankton groups. (<a href="https://doi.org/10.3389/fmars.2024.1287497" target="_blank" rel="noopener noreferrer">Pham et al. 2024</a>)

          - src: /assets/media/north-atlantic-surface-velocity.gif
            alt: Animated North Atlantic sea surface velocity with major currents and eddies.
            caption: >-
              Modeled North Atlantic surface velocity shows currents, eddies, and retroflection regions that transport and reshape water masses. These circulation features help explain how plankton communities are mixed, separated, and redistributed. (<a href="https://doi.org/10.1029/2025JC022543" target="_blank" rel="noopener noreferrer">Pham et al. 2026</a>)

      - kind: paragraph
        text: To characterize these changing habitats, we use environmental and biogeochemical observations to identify recurring ocean states and compare the plankton communities associated with them. Repeated combinations of temperature, salinity, nutrients, oxygen, light, and chlorophyll reveal habitat structure that may not follow geographic boundaries. One contribution of this work is using unsupervised learning, including hierarchical clustering and principal component analysis, to let the observations define habitat types rather than forcing samples into pre-set regions. Applied to Biogeochemical-Argo profiles, this approach provides a finer-scale and more flexible view of plankton habitats than static province maps, while still being scalable across large ocean regions and comparable with satellite-derived phytoplankton functional types.

      - src: /assets/media/habitat-delineation-machine-learning.png
        alt: Hierarchical clustering and principal component analysis for habitat delineation from environmental and biogeochemical observations.
        caption: >-
          Hierarchical clustering and principal component analysis (PCA) applied to biogeochemical observations classify dynamic plankton habitats along water-mass, nutrient, and chlorophyll gradients rather than fixed geographic boundaries. These unsupervised methods are useful because they reduce many measurements into interpretable patterns of habitat similarity and difference, then allow biological observations from floats, ships, and satellites to be compared within those data-defined habitats. (<a href="https://doi.org/10.1029/2025JC022543" target="_blank" rel="noopener noreferrer">Pham et al. 2026</a>)
        class: wide-figure


  - id: planktonic-community-structure
    title: Plankton Ecology
    blocks:
      - kind: paragraph
        text: Plankton ecology examines how plankton grow, interact, co-occur, and respond to changing ocean conditions. Plankton rarely occur as isolated species; they form communities whose members compete, coexist, respond to shared environmental conditions, and support different parts of the marine food web. The ecological role of a plankton community depends not only on how much biomass is present, but also on which organisms make up that biomass. A bloom dominated by one group can have different consequences for food webs, carbon export, nutrient cycling, or harmful bloom risk than the same amount of biomass distributed across many taxa. High-frequency plankton imaging makes it possible to study communities as dynamic assemblages that reorganize across water masses, seasons, and years, so we examine both "how much is there" and "who is there" as complementary signals of ecosystem change.

      - src: /assets/media/ifcb-example-image-sosik-lab-whoi.png
        alt: Example Imaging FlowCytobot plankton images from the Sosik Lab at WHOI.
        caption: >-
          Imaging FlowCytobot (IFCB) images show the morphological diversity of phytoplankton and microplankton. Each image is a small biological observation, and automated classification can turn thousands of images into taxonomic, biovolume, and carbon-based community data. That makes it possible to measure community change across seasons, years, and water masses at a scale that would be difficult with microscopy alone. Credit:
          <a href="https://ifcb-data.whoi.edu/about" target="_blank" rel="noopener noreferrer">Sosik Lab @ WHOI</a>.
        class: wide-figure

      - kind: paragraph
        text: >-
          Through the
          <a href="https://nes-lter.whoi.edu/" target="_blank" rel="noopener noreferrer">Northeast U.S. Shelf Long-Term
          Ecological Research (NES-LTER) program</a>, we study spatial, seasonal, and interannual variability in
          phytoplankton biomass and community composition across a cross-shelf transect from nearshore waters to the shelf
          break. Metacommunity analyses help separate local variability from regional variability and distinguish aggregate
          change in total biomass from compositional turnover in the taxa present. Communities can appear synchronized in
          total biomass while becoming less synchronized in composition, or vice versa, revealing whether the
          shelf is changing as a coherent region or as a set of locally distinct habitats. We also use topic-modeling approaches
          to identify recurring assemblages within complex image-based plankton datasets, treating each sample as a mixture of
          community patterns rather than a single fixed category.

      - kind: gallery
        class: theme-gallery paired-gallery
        items:
          - src: /assets/media/metacommunity-variability.png
            alt: Metacommunity variability figure showing annual and partitioned plankton community signals.
            caption: >-
              Metacommunity analysis of Imaging FlowCytobot observations separates variability in total phytoplankton biomass from variability in community composition. This distinction helps show whether change is driven mainly by more or less plankton overall, by shifts in which taxa are present, or by differences in how synchronized communities are across the Northeast U.S. Shelf.

          - src: /assets/media/ifcb-topic-modeling.png
            alt: IFCB topic-modeling figure showing plankton community structure across depth and latitude.
            caption: >-
              A natural-language-processing approach, similar to Latent Dirichlet Allocation (LDA), represents each plankton sample as a mixture of recurring assemblages. This is useful for plankton ecology because samples often contain overlapping communities rather than clean, mutually exclusive groups. Topic modeling can reveal which organisms tend to appear together across depth, latitude, and environmental gradients while preserving that mixture structure.

  - id: ocean-technologies
    title: Ocean Observing Technologies
    blocks:
      - kind: paragraph
        text: >-
          Plankton communities can change over meters to ocean basins and from minutes to seasons. Capturing that variability
          requires observing systems that measure biology together with the physical and chemical conditions surrounding it.
          Modern ocean observing systems collect detailed physical, chemical, and biological measurements, but those
          observations become most useful when they can be viewed together. Each instrument captures part of the ecosystem:
          one may measure water properties, another may capture images, and another may place local observations in a wider
          regional setting. We develop data systems that connect
          mobile-platform measurements, plankton imagery, remote sensing, and modeled ocean data so research teams can
          interpret biological patterns in context. High-resolution platforms can generate large, asynchronous streams of
          sensor, navigation, and image data faster than a team can inspect manually. A shared
          data system makes those observations usable for near-real-time analysis, adaptive sampling decisions, post-cruise
          synthesis, data sharing, and communication across scientists with different expertise.

      - kind: subtheme
        title: Mobile Observing Data Systems
        text: >-
          We build data-processing pipelines and interactive dashboards for observations from tow sleds, autonomous
          vehicles, and shipboard sensor systems. These tools bring together sensor streams, vehicle tracks, deployment
          metadata, and imagery so field teams can review data quality, explore water-column structure, and identify
          features of interest during and after cruises. They help turn a cruise's many separate measurements into a shared
          view of what happened in the water. By standardizing ingestion, calibration, synchronization, spatiotemporal binning,
          and image-to-environment linking, the workflow also makes derived products easier to reproduce, export, share, and
          inspect collaboratively without requiring every user to write custom code. See the
          <a href="https://stingraydash.whoi.edu" target="_blank" rel="noopener noreferrer">Stingray dashboard</a>.

      - src: /assets/media/tow-sled-data-integration.png
        alt: Data integration workflow for tow-sled ocean observations.
        caption: >-
          The tow-sled data workflow integrates sensor records, image data, vehicle tracks, and deployment metadata into a shared timeline. Researchers can explore mobile-platform observations in their physical and biological context, review imagery from specific water-column features, and communicate results through shared data products and figures.
        class: wide-figure

      - kind: subtheme
        title: Machine Learning for Plankton Imaging
        text: >-
          We develop end-to-end machine-learning and computer-vision workflows for plankton image data. These workflows
          help transform large image collections into ecological information about abundance, distribution, community
          composition, and change through time. The goal is not just to automate image sorting, but to make image streams
          useful for ecological interpretation. Machine learning is important for plankton imaging because modern instruments
          can produce millions of images, far beyond what can be reviewed manually. Detection, classification, trait extraction,
          uncertainty screening, and quality control make it possible to map organisms back onto environmental gradients and
          ask ecological questions at the scale of cruises, seasons, and observing networks.

      - kind: gallery
        class: theme-gallery paired-gallery
        items:
          - type: video
            src: /assets/media/shadowgraph-yolo-short.mp4
            poster: /assets/media/shadowgraph-yolo-poster.jpg
            alt: Computer-vision analysis of high-volume shadowgraph plankton imagery.
            caption: >-
              The shadowgraph machine-learning workflow detects plankton and particles in high-volume image streams. Automated detection turns millions of images into data that can be mapped back onto the sampled water column, allowing biological patterns to be compared directly with depth, salinity, temperature, chlorophyll, and other measurements.

          - src: /assets/media/shadowgraph-zooplankton-distribution.jpg
            alt: Shadowgraph-derived zooplankton distribution visualization.
            caption: >-
              Shadowgraph-derived zooplankton detections are mapped along the sampling transect to show where organisms occur in relation to depth and location. This connects individual image detections to spatial patterns in plankton abundance and helps identify layers, hotspots, or habitat associations that would be hard to see from station samples alone. (<a href="https://doi.org/10.1029/2025JC022543" target="_blank" rel="noopener noreferrer">Pham et al. 2026</a>)

      - kind: subtheme
        title: Environmental Data Integration
        text: >-
          We use remote sensing, data mining, and modeled ocean products to place high-resolution biological observations
          into broader physical and biogeochemical context. This helps connect local measurements with regional and
          basin-scale patterns in water masses, seasonality, nutrients, and phytoplankton communities, so a biological
          observation can be interpreted as part of a larger ocean process. In situ observations are essential because they
          provide direct measurements of organisms and their environment, but they are limited in space and time. Satellites,
          floats, models, and historical datasets help show whether a local observation reflects a short-lived feature, a
          regional circulation pathway, a seasonal transition, or a broader climate-related pattern.

      - kind: gallery
        class: theme-gallery paired-gallery
        items:
          - src: /assets/media/northeast-us-shelf-physical-properties.jpg
            alt: Northeast U.S. Shelf physical properties and frontal gradients.
            caption: >-
              Satellite sea-surface temperature and towed-vehicle salinity observations show a 2023 salinity-maximum intrusion over the Northeast U.S. Shelf. The intrusion brought warm, salty slope water onto the shelf and created a pathway for offshore biological communities, including plankton, zooplankton, and larval fish, to move into shelf habitats. (<a href="https://doi.org/10.1002/lno.70388" target="_blank" rel="noopener noreferrer">Pham et al. 2026</a>)

          - src: /assets/media/phytoplankton-functional-type-remote-sensing.gif
            alt: Animated remote-sensing view of phytoplankton functional types.
            caption: >-
              Satellite-derived phytoplankton functional type data estimate broad groups such as diatoms, dinoflagellates, haptophytes, and cyanobacteria. These products help connect local biological observations to regional and basin-scale community patterns. (<a href="https://doi.org/10.1029/2025JC022543" target="_blank" rel="noopener noreferrer">Pham et al. 2026</a>)

  - id: current-directions
    title: Current Directions
    blocks:
      - kind: list
        items:
          - Computer-vision systems for scalable plankton detection, classification, trait extraction, and quality-controlled image analysis, so large image streams can become reliable ecological datasets.
          - Representation-learning approaches, including contrastive, self-supervised, and multimodal methods, for extracting ecological information from complex plankton observations with less dependence on fully labeled training data.
          - Generative and foundation-model approaches for linking biological observations, environmental context, and existing scientific knowledge across different data types.
          - Integration of imaging, environmental sensors, autonomous platforms, remote sensing, and other heterogeneous observations for ecosystem-scale analysis across space and time.
