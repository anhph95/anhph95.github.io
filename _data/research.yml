intro:
  carousel:
    label: research image
    items:
      - src: /assets/media/stingray-deployment.jpg
        alt: Stingray imaging platform deployment at sea.
        caption: >-
          A Stingray tow-sled deployment illustrates how mobile platforms collect high-resolution biological and environmental observations along ship tracks. The research challenge is turning those fast, multi-sensor data streams into ecological information.

      - src: /assets/media/ctd-sampling-during-rough-sea.jpg
        alt: CTD sampling in rough sea conditions.
        caption: >-
          CTD casts provide direct water-column measurements such as temperature, salinity, nutrients, and chlorophyll. These shipboard observations help ground-truth and interpret data from autonomous platforms and imaging systems.

  paragraphs:
    - Our research examines how plankton communities are organized, transported, and transformed in a changing ocean. We combine field observations, autonomous platforms, satellite and modeled data, imaging systems, and computational analysis to connect biological patterns with the environmental conditions that shape them.

sections:
  - id: biogeography
    title: Plankton Biogeography
    blocks:
      - kind: paragraph
        text: >-
          Marine biogeography is often described using regional frameworks that divide the ocean into provinces, ecoregions,
          or assessment regions. These maps provide useful context, but plankton habitats are also shaped by moving gradients
          in salinity, nutrients, light, temperature, and water-column structure. We study these habitats as dynamic
          biological-environmental states rather than fixed boundaries on a map, drawing on work with the
          <a href="https://montoyalab.gatech.edu/" target="_blank" rel="noopener noreferrer">Montoya Lab at Georgia Tech</a>.

      - kind: carousel
        label: biogeography framework
        items:
          - src: /assets/media/global-biogeography-longhurst-province.png
            alt: Global ocean biogeography map with Longhurst provinces.
            caption: >-
              Longhurst provinces divide the ocean into broad biogeochemical regions based on recurring patterns in phytoplankton biomass, seasonality, and ocean conditions. They provide a useful baseline, but many plankton habitats shift at finer scales.

          - src: /assets/media/global-biogeography-Spalding-marine-ecoregions.png
            alt: Global map of marine ecoregions.
            caption: >-
              Marine ecoregions organize coastal and shelf ecosystems into comparable ecological units. They help frame biodiversity patterns, but plankton communities may respond more directly to moving water masses and local gradients.

          - src: /assets/media/global-biogeography-ipcc-ar6-marine-regions.png
            alt: Global map of IPCC AR6 marine regions.
            caption: >-
              IPCC AR6 marine regions provide standardized areas for assessing climate-driven ocean change. We use these broad frameworks as context while asking how plankton habitats vary within and across them.

      - kind: paragraph
        text: Dynamic features such as river plumes, boundary currents, eddies, fronts, and water-mass intrusions create shifting habitats for plankton. In the western tropical North Atlantic, the Amazon River Plume forms a patchwork of river-influenced and oceanic waters that favor different phytoplankton groups. Across the basin, circulation and seasonal changes alter nutrient supply, subsurface chlorophyll structure, and the movement of biological communities.

      - kind: gallery
        class: theme-gallery paired-gallery
        items:
          - src: /assets/media/dynamic-amazon-river-plume.gif
            alt: Animated shipboard observation of Amazon River plume dynamics.
            caption: >-
              Shipboard observations in the western tropical North Atlantic show the Amazon River Plume forming a moving mosaic of low-salinity plume water and oceanic water. This gradient creates distinct habitats that favor different phytoplankton groups.

          - src: /assets/media/north-atlantic-surface-velocity.gif
            alt: Animated North Atlantic sea surface velocity with major currents and eddies.
            caption: >-
              Modeled North Atlantic surface velocity shows currents, eddies, and retroflection regions that transport and reshape water masses. These circulation features help explain how plankton communities are mixed, separated, and redistributed.

      - kind: paragraph
        text: To characterize these changing habitats, we use environmental and biogeochemical observations to identify recurring ocean states and compare the plankton communities associated with them. This approach helps connect local field observations with broader patterns observed by Biogeochemical-Argo floats, satellites, and regional ocean datasets.

      - src: /assets/media/habitat-delineation-machine-learning.png
        alt: Hierarchical clustering and principal component analysis for habitat delineation from environmental and biogeochemical observations.
        caption: >-
          Hierarchical clustering and principal component analysis (PCA) applied to biogeochemical observations classify dynamic plankton habitats along water-mass, nutrient, and chlorophyll gradients rather than fixed geographic boundaries.
        class: wide-figure


  - id: planktonic-community-structure
    title: Plankton Community Ecology
    blocks:
      - kind: paragraph
        text: High-frequency plankton imaging makes it possible to study communities as dynamic assemblages that reorganize across water masses, seasons, and years. We examine both how much plankton biomass is present and which organisms make up the community, because changes in abundance and changes in composition can tell different ecological stories.

      - src: /assets/media/ifcb-example-image-sosik-lab-whoi.png
        alt: Example Imaging FlowCytobot plankton images from the Sosik Lab at WHOI.
        caption: >-
          Imaging FlowCytobot (IFCB) images show the morphological diversity of phytoplankton and microplankton. Converting these images into taxonomic and biomass data allows community change to be measured across seasons, years, and water masses. Credit:
          <a href="https://ifcb-data.whoi.edu/about" target="_blank" rel="noopener noreferrer">Sosik Lab @ WHOI</a>.
        class: wide-figure

      - kind: paragraph
        text: >-
          Through the
          <a href="https://nes-lter.whoi.edu/" target="_blank" rel="noopener noreferrer">Northeast U.S. Shelf Long-Term
          Ecological Research (NES-LTER) program</a>, we study spatial, seasonal, and interannual variability in
          phytoplankton biomass and community composition. Metacommunity analyses help show when local communities change
          together and when species composition becomes less synchronized. We also use topic-modeling approaches to identify
          recurring assemblages within complex image-based plankton datasets.

      - kind: gallery
        class: theme-gallery paired-gallery
        items:
          - src: /assets/media/metacommunity-variability.png
            alt: Metacommunity variability figure showing annual and partitioned plankton community signals.
            caption: >-
              Metacommunity analysis of Imaging FlowCytobot observations separates variability in total phytoplankton biomass from variability in community composition, showing how plankton communities change in both abundance and taxonomic identity across the Northeast U.S. Shelf.

          - src: /assets/media/ifcb-topic-modeling.png
            alt: IFCB topic-modeling figure showing plankton community structure across depth and latitude.
            caption: >-
              A natural-language-processing approach, similar to Latent Dirichlet Allocation (LDA), represents each plankton sample as a mixture of recurring assemblages. This reveals co-occurrence patterns across depth, latitude, and environmental gradients.


  - id: harmful-algal-blooms
    title: Harmful Algal Blooms
    blocks:
      - kind: paragraph
        text: >-
          In collaboration with the Department of Marine Plankton at the
          <a href="https://vnio.org.vn/en/" target="_blank" rel="noopener noreferrer">Institute of Oceanography, Vietnam</a>,
          we study potentially harmful and toxin-producing algae in coastal waters. This work connects seasonal field
          observations, coastal habitats, microscopy, morphology, phylogeny, and culture experiments to improve species
          identification and understand when harmful taxa occur.

      - src: /assets/media/toxic-algae.png
        alt: Microscopic imagery of potentially harmful algal species.
        caption: >-
          Microscopy, morphology, DNA sequencing, and culture experiments help distinguish potentially harmful algal species that can look similar under the microscope. This work improves identification of toxin-producing taxa in coastal Vietnamese waters. Credit: Department of Marine Plankton, Institute of Oceanography, Vietnam.
        class: wide-figure


  - id: ocean-technologies
    title: Ocean Observing Technologies
    blocks:
      - kind: paragraph
        text: >-
          Modern ocean observing systems collect detailed physical, chemical, and biological measurements, but those
          observations become most useful when they can be viewed together. We develop data systems that connect
          mobile-platform measurements, plankton imagery, remote sensing, and modeled ocean data so research teams can
          interpret biological patterns in context.

      - kind: subtheme
        title: Mobile Observing Data Systems
        text: >-
          We build data-processing pipelines and interactive dashboards for observations from tow sleds, autonomous
          vehicles, and shipboard sensor systems. These tools bring together sensor streams, vehicle tracks, deployment
          metadata, and imagery so field teams can review data quality, explore water-column structure, and identify
          features of interest during and after cruises. See the
          <a href="https://stingraydash.whoi.edu" target="_blank" rel="noopener noreferrer">Stingray dashboard</a>.

      - src: /assets/media/tow-sled-data-integration.png
        alt: Data integration workflow for tow-sled ocean observations.
        caption: >-
          The tow-sled data workflow integrates sensor records, image data, vehicle tracks, and deployment metadata into a shared timeline. This makes it possible to explore mobile-platform observations in their physical and biological context.
        class: wide-figure

      - kind: subtheme
        title: Machine Learning for Plankton Imaging
        text: >-
          We develop end-to-end machine-learning and computer-vision workflows for plankton image data. These workflows
          help transform large image collections into ecological information about abundance, distribution, community
          composition, and change through time.

      - kind: gallery
        class: theme-gallery paired-gallery
        items:
          - type: video
            src: /assets/media/shadowgraph-yolo-short.mp4
            poster: /assets/media/shadowgraph-yolo-poster.jpg
            alt: Computer-vision analysis of high-volume shadowgraph plankton imagery.
            caption: >-
              The shadowgraph machine-learning workflow detects plankton and particles in high-volume image streams. Automated detection turns millions of images into data that can be mapped back onto the sampled water column.

          - src: /assets/media/shadowgraph-zooplankton-distribution.jpg
            alt: Shadowgraph-derived zooplankton distribution visualization.
            caption: >-
              Shadowgraph-derived zooplankton detections are mapped along the sampling transect to show where organisms occur in relation to depth and location. This connects individual image detections to spatial patterns in plankton abundance.

      - kind: subtheme
        title: Environmental Data Integration
        text: >-
          We use remote sensing, data mining, and modeled ocean products to place high-resolution biological observations
          into broader physical and biogeochemical context. This helps connect local measurements with regional and
          basin-scale patterns in water masses, seasonality, nutrients, and phytoplankton communities.

      - kind: gallery
        class: theme-gallery paired-gallery
        items:
          - src: /assets/media/northeast-us-shelf-physical-properties.jpg
            alt: Northeast U.S. Shelf physical properties and frontal gradients.
            caption: >-
              Satellite sea-surface temperature and towed-vehicle salinity observations show a 2023 salinity-maximum intrusion over the Northeast U.S. Shelf. The intrusion brought warm, salty slope water onto the shelf and created a pathway for offshore biological communities.

          - src: /assets/media/phytoplankton-functional-type-remote-sensing.gif
            alt: Animated remote-sensing view of phytoplankton functional types.
            caption: >-
              Satellite-derived phytoplankton functional type data estimate broad groups such as diatoms, dinoflagellates, haptophytes, and cyanobacteria. These products help connect local biological observations to regional and basin-scale community patterns.

  - id: current-directions
    title: Current Directions
    blocks:
      - kind: list
        items:
          - Computer-vision systems for scalable plankton detection, classification, trait extraction, and quality-controlled image analysis.
          - Representation-learning approaches, including contrastive, self-supervised, and multimodal methods, for extracting ecological information from complex plankton observations.
          - Generative and foundation-model approaches for linking biological observations, environmental context, and existing scientific knowledge.
          - Integration of imaging, environmental sensors, autonomous platforms, remote sensing, and other heterogeneous observations for ecosystem-scale analysis across space and time.
