hero:
  eyebrow: Biological Oceanography · Plankton Ecology · Data Science
  title: AI-empowered insight into dynamic marine ecosystems.
  lead: We leverage advanced ocean-observing technologies and artificial intelligence to understand how plankton communities respond to a changing ocean. Our work integrates field observations, autonomous platforms, remote sensing, imaging systems, and computational analyses to examine marine community dynamics across spatial and temporal scales.
  carousel:
    label: homepage landscape
    items:
      - src: /assets/media/hero/flying-fish.jpg
        alt: Flying fish underwater.
      - src: /assets/media/hero/seabird.jpg
        alt: Seabird flying above the ocean.
      - src: /assets/media/hero/sunset.jpg
        alt: Sunset over the ocean.
      - src: /assets/media/hero/whale.jpg
        alt: Whale fluke above the ocean surface.
      - src: /assets/media/hero/wind-farm-sunset.jpg
        alt: Offshore wind farm at sunset.
      - src: /assets/media/hero/windmill.jpg
        alt: Offshore wind turbine over the ocean.
  links:
    - label: Research Themes
      url: /research/
    - label: Publications
      url: /publications/
      variant: secondary
