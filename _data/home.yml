          Imaging
          Remote Sensing
          Data Mining
          Machine Learning

observation_technologies:
  eyebrow: Observation Technologies
  title: From high-resolution sensors to ecological data products
  grid_class: visual-strip tech-strip
  items:
    - src: /assets/media/ctd.jpg
      alt: CTD rosette over the ocean at sunset.
      caption: CTD rosettes provide detailed water-column profiles and seawater samples that anchor ocean observations.
    - src: /assets/media/bgc-argo-float.jpg
      alt: Biogeochemical-Argo float being deployed at sea.
      caption: >-
        BGC-Argo floats extend ship-based observations through autonomous profiling across broad ocean regions.
        <span class="image-credit">Credit: Emilie Diamond Riquier, IMEV - Institut de la Mer de Villefranche.</span>
    - src: /assets/media/stingray-tow-sled.jpg
      alt: Stingray tow sled on a research vessel.
      caption: Tow sleds resolve fine-scale variability between vertical profiles by sampling continuously along ship tracks.
    - src: /assets/media/lrauv.jpg
      alt: Long-range autonomous underwater vehicle used for ocean observation.
      caption: >-
        AUVs maintain high-resolution while enabling sustained, adaptive observations across moving water masses.
        <span class="image-credit">Credit: Sean P. Whelan, Woods Hole Oceanographic Institution.</span>
    - src: /assets/media/pace-satellite.jpg
      alt: Satellite view supporting global ocean observation.
      caption: >-
        Satellite observations connect local measurements with global-scale patterns.
        <span class="image-credit">Credit: NASA Scientific Visualization Studio.</span>
    - src: /assets/media/bongo-net.jpg
      alt: Bongo net being recovered from the ocean.
      caption: Traditional sampling methods provide ground truth for automated observations.

research_program:
  title: Research Program
  class: alt
  items:
    - title: Harmful Algal Blooms
      url: /research/#harmful-algal-blooms
      summary: Some phytoplankton species can harm marine life and coastal communities. We study when these algae appear, what conditions favor them, and how species identity shapes bloom risk.
    - title: Plankton Biogeography
      url: /research/#biogeography
      summary: Plankton habitats shift with currents, seasons, river plumes, and ocean fronts. We study how these moving environments organize marine life across coastal and open-ocean regions.
    - title: Plankton Ecology
      url: /research/#planktonic-community-structure
      summary: Plankton species interact, co-occur, and respond together to changing ocean conditions. We study how these community patterns reorganize across water masses, seasons, and years.
    - title: Ocean Observing Technologies
      url: /research/#ocean-technologies
      summary: Long-term plankton research depends on consistent observations across cruises, platforms, and changing technologies. We develop data and visualization tools that keep ecological questions connected.

