intro:
  paragraphs:
    - We teach biology, ecology, oceanography, and environmental data analysis through real examples from marine systems. Our teaching and mentoring help students connect organisms, ecosystems, observations, and data so they can ask clear questions, evaluate evidence, and communicate scientific results with confidence.

sections:
  - title: Teaching and Training Areas
    blocks:
      - kind: paragraph
        text: >-
          Our teaching spans introductory biology, organismal biology, ecology, biological oceanography, environmental science,
          statistics, and data science. Students work with examples from marine and environmental systems, including
          plankton communities, oceanographic time series, field observations, microscopy images, and satellite products.
      - kind: paragraph
        text: >-
          Courses and training activities emphasize movement between ecological concepts, quantitative reasoning, and scientific
          communication. The goal is to understand how observations become evidence, and how evidence supports an ecological
          interpretation.

  - title: Data-Driven Learning
    blocks:
      - kind: paragraph
        text: >-
          Ocean and environmental datasets give students a practical way to learn statistics, coding, visualization, uncertainty,
          and reproducible workflows. Data-rich examples help students understand not only how to run an analysis, but
          also what the result means biologically.
      - kind: paragraph
        text: >-
          We also develop coding-training materials, including the
          <a href="https://github.com/anhph95/R_stats">R_stats</a> repository, for learners building confidence with
          statistics, ecological data analysis, and reproducible research.

  - title: Mentoring and Research Training
    blocks:
      - kind: paragraph
        text: >-
          We mentor students through structured, hands-on research experiences. Trainees learn how to organize data, document
          decisions, evaluate uncertainty, make clear figures, and communicate results to audiences with different
          backgrounds.
      - kind: paragraph
        text: >-
          Because the research program connects ecology, oceanography, computation, and observing technology, students are encouraged to
          build fluency across disciplines while developing ownership of their own scientific questions.

courses:
  - title: Courses Taught
    items:
      - Introductory Biology
      - Organismal Biology
      - Molecular Biology
      - Ecology
      - Biostatistics
      - Experimental Design and Statistical Methods
  - title: Courses We Can Support
    items:
      - Marine Biology
      - Environmental Science
      - Biological Oceanography
      - Marine Ecology
      - Marine Biogeochemistry
      - Data Science

outreach:
  title: Outreach
  paragraphs:
    - Outreach activities focus on making ocean science and ocean observing systems easier to explore. We use visual tools, field examples, and interactive data products to help students and broader audiences connect marine ecosystems, climate, technology, and environmental change.
