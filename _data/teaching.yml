intro:
  carousel:
    label: teaching image
    items:
      - src: /assets/media/ctd-recovery.jpg
        alt: CTD rosette recovery from a research vessel.
        caption: CTD rosette recoveries bring water-column measurements and seawater samples back to the ship. These observations connect biological samples with the physical and chemical structure of the water column.
      - src: /assets/media/ctd-sampling-during-rough-sea.jpg
        alt: CTD sampling in rough sea conditions.
        caption: CTD casts provide direct water-column measurements such as temperature, salinity, nutrients, and chlorophyll. These shipboard observations help ground-truth and interpret data from autonomous platforms and imaging systems.
      - src: /assets/media/stingray-recovery.jpg
        alt: Stingray imaging platform recovery at sea.
        caption: A Stingray tow-sled recovery. Platforms like this can carry imaging and environmental sensors through the water column; the research challenge is connecting those observations to ecological patterns.
      - src: /assets/media/bongo-deployment.jpg
        alt: Bongo net deployment from a research vessel.
        caption: Bongo net deployments provide physical samples of plankton and other small marine organisms. These traditional collections help ground-truth automated imaging and sensor-based observations.
      - src: /assets/media/night-shift-on-deck.jpg
        alt: Scientist working on deck during a night shift at sea.
        caption: Around-the-clock deck operations are often needed to capture rapidly changing ocean conditions. Field observations depend on careful coordination between people, instruments, weather, and ship operations.
      - src: /assets/media/trawl-net-deployment.jpg
        alt: Trawl net deployment during nighttime field work.
        caption: Net deployments collect biological material that complements optical and sensor-based observing systems. Combining direct samples with instrument data helps interpret what automated platforms detect in the water.
  paragraphs:
    - I teach biology, ecology, oceanography, and data analysis through real environmental examples. My courses and mentoring help students connect organisms, ecosystems, observations, and data so they can ask clear questions and explain scientific evidence with confidence.

sections:
  - title: Teaching Areas
    blocks:
      - kind: paragraph
        text: >-
          My teaching spans introductory biology, organismal biology, ecology, biological oceanography, environmental science,
          statistics, and data science. Students will work with examples from marine and environmental systems, including
          plankton communities, oceanographic time series, field observations, microscopy images, and satellite products.
      - kind: paragraph
        text: >-
          In class, students will practice moving between ecological concepts, quantitative reasoning, and scientific
          communication. The goal is to understand how observations become evidence and how evidence supports an ecological
          interpretation.

  - title: Learning With Data
    blocks:
      - kind: paragraph
        text: >-
          Ocean and environmental datasets give students a practical way to learn statistics, coding, visualization, uncertainty,
          and reproducible workflows. Data-rich examples help students understand not only how to run an analysis, but
          also what the result means biologically.
      - kind: paragraph
        text: >-
          I also develop coding-training materials, including the
          <a href="https://github.com/anhph95/R_stats">R_stats</a> repository, for learners building confidence with
          statistics, ecological data analysis, and reproducible research.

  - title: Mentoring and Research Training
    blocks:
      - kind: paragraph
        text: >-
          I mentor students through structured, hands-on research experiences. Trainees learn how to organize data, document
          decisions, evaluate uncertainty, make clear figures, and communicate results to audiences with different
          backgrounds.
      - kind: paragraph
        text: >-
          Because my research connects ecology, oceanography, computation, and observing technology, students are encouraged to
          build fluency across disciplines while developing ownership of their own scientific questions.

